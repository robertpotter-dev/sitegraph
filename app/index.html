<!doctype html>
<html lang="en">
  <head>
    <meta
      name="description"
      content="SiteGraph is a proprietary, browser-native application for documenting and planning physical and logical IT infrastructure."
    />
    <meta property="og:title" content="SiteGraph" />
    <meta
      property="og:description"
      content="Offline-first network and asset documentation. One compiled HTML application, one portable JSON file per site, no application backend."
    />
    <meta
      property="og:image"
      content="https://robertpotter-dev.github.io/sitegraph/img/social-preview.png"
    />
    <meta property="og:url" content="https://robertpotter-dev.github.io/sitegraph/app/" />
    <meta property="og:type" content="website" />
    <link rel="canonical" href="https://robertpotter-dev.github.io/sitegraph/app/" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f3f9ff" />
    <style data-sitegraph-theme-bootstrap>
      html,
      body {
        background: oklch(98% 0.015 260);
        color-scheme: light;
      }
      html[data-theme='dark'],
      html[data-theme='dark'] body {
        background: #000;
        color-scheme: dark;
      }
    </style>
    <script data-sitegraph-theme-bootstrap>
      (() => {
        let theme;
        try {
          theme = localStorage.getItem('sitegraph-theme');
        } catch {}
        if (theme !== 'dark' && theme !== 'light') {
          theme = window.matchMedia?.('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').content =
          theme === 'dark' ? '#000000' : '#f3f9ff';
      })();
    </script>
